# Parameters of motion_server. motions_dir is set by the launch file.
motion_server:
  ros__parameters:
    leader_topic: /leader/joint_states
    follower_state_topic: /follower/joint_states
    arm_action: /follower/joint_trajectory_controller/follow_joint_trajectory
    gripper_action: /follower/gripper_controller/gripper_cmd
    arm_joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_flex_joint, wrist_flex_joint, wrist_roll_joint]
    record_joints: [shoulder_pan_joint, shoulder_lift_joint, elbow_flex_joint, wrist_flex_joint, wrist_roll_joint, gripper_jaw_joint]
    gripper_joint: gripper_jaw_joint
    play_gripper: true
    default_approach_time: 2.0     # s, move to the first pose of a motion
    max_speed: 2.0                 # max allowed speed multiplier
    start_delay: 0.2               # s, trajectory start after the goal is accepted
    motion_threshold: 0.02         # rad, "the leader started moving"
    default_max_recording: 120.0   # s, safety limit for one recording
    gripper_rate: 20.0             # Hz
    gripper_threshold: 0.005       # rad
    gripper_max_effort: 10.0
    teleop_services: [/arm_relay/set_enabled, /gripper_relay/set_enabled]
    pause_teleop_on_play: true
